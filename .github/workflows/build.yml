name: Build HomePodBridge rootless tweak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: brew install ldid dpkg

      - name: Install Theos and iOS 16.5 SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          curl --fail --location --retry 3 \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            --output "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          tar -xf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            -C "$GITHUB_WORKSPACE/theos/sdks"

      - name: Build signed rootless arm64e package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: make package FINALPACKAGE=1

      - name: Upload Sileo package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomePodBridge-rootless-deb
          path: packages/*.deb
          if-no-files-found: warn

      - name: Build flat Sileo APT repository
        run: python3 scripts/build_repo.py packages docs

      - name: Publish Sileo index to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Publish HomePodBridge Sileo repository [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish dedicated Sileo site to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/homepodbridge-pages" origin/gh-pages
          rsync -a --delete --exclude='.git' docs/ "$RUNNER_TEMP/homepodbridge-pages/"
          git -C "$RUNNER_TEMP/homepodbridge-pages" add -A
          if ! git -C "$RUNNER_TEMP/homepodbridge-pages" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/homepodbridge-pages" commit -m "Publish HomePodBridge Sileo APT package"
            git -C "$RUNNER_TEMP/homepodbridge-pages" push origin HEAD:gh-pages
          fi
