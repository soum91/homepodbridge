name: Build HomePodBridge rootless tweak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: brew install ldid dpkg

      - name: Install Theos and iOS 16.5 SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          curl --fail --location --retry 3 \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            --output "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          tar -xf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            -C "$GITHUB_WORKSPACE/theos/sdks"

      - name: Build signed rootless arm64e package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: make package FINALPACKAGE=1

      - name: Upload Sileo package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomePodBridge-rootless-deb
          path: packages/*.deb
          if-no-files-found: warn
